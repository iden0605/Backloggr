[package]
name = "tauri-app"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints.rust]
# objc 0.2's sel_impl! macro expands a legacy `feature = "cargo-clippy"` cfg check on every
# msg_send! call site — declare it expected instead of letting it warn.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
# macos-private-api: required for the transparent in-game overlay toast window (see overlay.rs)
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-autostart = "2.5.1"

# Only needed for the macOS game-window bounds lookup (CGWindowListCopyWindowInfo), so clips can
# be cropped to just the game's window — ffmpeg's avfoundation input can only capture whole
# displays, unlike Windows' gdigrab window capture.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
# Raw NSWindow tweaks for the overlay toast (window level + fullscreen-Space collection
# behavior) that tauri doesn't expose.
objc = "0.2"

# Only needed for Windows' window-title lookup (resolving which window belongs to the tracked
# game's process, so capture can be scoped to that window instead of the whole desktop).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
# WASAPI loopback capture of the default output device (loopback.rs) — zero-setup game/system
# audio in clips, no virtual loopback device needed.
cpal = "0.15"

